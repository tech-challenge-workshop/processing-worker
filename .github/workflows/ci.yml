name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The broker e2e suite's RabbitMQ. A job service, like the Notification
    # CI's: started by the runner itself, it boots where a `docker run` of
    # the same image failed on the Erlang cookie (eacces). The stack's
    # topology is imported after checkout, below.
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # FFprobe and FFmpeg run for real in the media tests; they fail rather
      # than skip without them, so the binaries are installed, not optional.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      # The S3 adapter's integration test needs a real endpoint, and fails
      # rather than skips in CI when STORAGE_ENDPOINT is unset. Same server
      # and development credentials as fiap-x-platform's compose (AD-014:
      # RustFS replaced MinIO, whose public images were withdrawn). Only the
      # endpoint is exported: the test defaults to these credentials, and
      # exporting the keys would switch the AppModule e2e suites to S3.
      - name: Start RustFS for the storage integration test
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=fiapx-dev -e RUSTFS_SECRET_KEY=fiapx-dev-secret \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 1
          done
          docker logs storage
          exit 1
      # The broker e2e suite needs a real RabbitMQ, and fails rather than
      # skips in CI when RABBITMQ_TEST_URL is unset. It runs with the stack's
      # own topology: definitions.json comes from a checkout of the public
      # platform repository, as the Catalog's CI takes 01-schemas.sql, and is
      # imported through the management API - the same file the platform's
      # rabbitmq.conf loads with load_definitions, which is all that file
      # configures. The import sets the vhost's quorum default, every queue
      # and its .dlq, and the dead-letter policy.
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/fiap-x-platform
          path: .platform
          sparse-checkout: rabbitmq
      - name: Load the platform's broker definitions
        run: |
          # The health check pings the node; the management API can take a
          # few more seconds to accept requests.
          for i in $(seq 1 30); do
            curl -fsS -u guest:guest -H 'content-type: application/json' \
              -X POST --data @.platform/rabbitmq/definitions.json \
              http://localhost:15672/api/definitions && break
            sleep 2
          done
          curl -fsS -u guest:guest http://localhost:15672/api/queues/%2F/video-validation.dlq >/dev/null
      - run: npm run test:e2e
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672
      - run: npm run build
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t ${{ github.event.repository.name }}:ci .
