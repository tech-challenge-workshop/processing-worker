name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # FFprobe and FFmpeg run for real in the media tests; they fail rather
      # than skip without them, so the binaries are installed, not optional.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      # The S3 adapter's integration test needs a real endpoint, and fails
      # rather than skips in CI when STORAGE_ENDPOINT is unset. Same server
      # and development credentials as fiap-x-platform's compose (AD-014:
      # RustFS replaced MinIO, whose public images were withdrawn). Only the
      # endpoint is exported: the test defaults to these credentials, and
      # exporting the keys would switch the AppModule e2e suites to S3.
      - name: Start RustFS for the storage integration test
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=fiapx-dev -e RUSTFS_SECRET_KEY=fiapx-dev-secret \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 1
          done
          docker logs storage
          exit 1
      # The broker e2e suite needs a real RabbitMQ, and fails rather than
      # skips in CI when RABBITMQ_TEST_URL is unset. It runs with the stack's
      # own topology: definitions.json and rabbitmq.conf come from a checkout
      # of the public platform repository, as the Catalog's CI takes
      # 01-schemas.sql, and are mounted where fiap-x-platform's compose mounts
      # them. A docker run step rather than a job service, because a service
      # starts before any checkout exists to mount.
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/fiap-x-platform
          path: .platform
          sparse-checkout: rabbitmq
      - name: Start RabbitMQ for the broker e2e suite
        run: |
          # Same image and user as the platform's compose: the Debian image
          # run as its default user cannot read its own Erlang cookie on the
          # hosted runner (eacces), and the stack runs the alpine one as 0:0.
          docker run -d --name rabbitmq -p 5672:5672 --user 0:0 \
            -v "$GITHUB_WORKSPACE/.platform/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-fiapx.conf:ro" \
            -v "$GITHUB_WORKSPACE/.platform/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro" \
            rabbitmq:4-management-alpine
          for i in $(seq 1 60); do
            if docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1 \
              && docker exec rabbitmq rabbitmqctl -q list_queues name | grep -qx 'video-validation.dlq'; then
              exit 0
            fi
            sleep 2
          done
          docker logs rabbitmq
          exit 1
      - run: npm run test:e2e
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672
      - run: npm run build
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t ${{ github.event.repository.name }}:ci .
