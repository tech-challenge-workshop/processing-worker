name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # FFprobe and FFmpeg run for real in the media tests; they fail rather
      # than skip without them, so the binaries are installed, not optional.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      # The S3 adapter's integration test needs a real endpoint, and fails
      # rather than skips in CI when STORAGE_ENDPOINT is unset. Same server
      # and development credentials as fiap-x-platform's compose (AD-014:
      # RustFS replaced MinIO, whose public images were withdrawn). Only the
      # endpoint is exported: the test defaults to these credentials, and
      # exporting the keys would switch the AppModule e2e suites to S3.
      - name: Start RustFS for the storage integration test
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=fiapx-dev -e RUSTFS_SECRET_KEY=fiapx-dev-secret \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 1
          done
          docker logs storage
          exit 1
      - run: npm run test:e2e
        env:
          STORAGE_ENDPOINT: http://localhost:9000
      - run: npm run build
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t ${{ github.event.repository.name }}:ci .
